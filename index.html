
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="description" content="Professional tennis match statistics and scoring application." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Court IQ" />
    
    <title>Court IQ - Tennis Analytics</title>
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="https://fdmw4tuurixhnt6l.public.blob.vercel-storage.com/icon.png" />
    <link rel="icon" type="image/png" href="https://fdmw4tuurixhnt6l.public.blob.vercel-storage.com/icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'tennis-green': '#ccff00',
              'tennis-dark': '#0f172a',
              'court-blue': '#3b82f6',
              'clay': '#c96a3e',
              'clay-light': '#f2a679',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for stats */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      /* Safe-area helpers for notched / gesture-bar phones */
      .safe-top { padding-top: env(safe-area-inset-top, 0px); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .safe-x { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
    </style>
</head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden selection:bg-tennis-green selection:text-black font-sans">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      // Only register the service worker in production. In dev (npm run dev) it just
      // caches stale files across restarts and confuses Vite's HMR/module resolution.
      if ('serviceWorker' in navigator && !location.hostname.match(/^(localhost|127\.0\.0\.1)$/)) {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(registration => {
            console.log('SW registered successfully:', registration.scope);
          })
          .catch(err => {
            console.log('SW registration failed:', err);
          });
      }
    </script>
  </body>
</html>
